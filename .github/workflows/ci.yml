name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # The backend tests run in shards next to each other. Which test goes to
  # which shard is decided by `--shard` (backend/tests/conftest.py), from a
  # checksum of the test's id, so there is no list of files or durations to
  # keep up to date. The job `backend-test` below is the one check that says
  # whether all of them passed.
  backend-test-shard:
    name: backend-test-shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # A failure in one shard should not hide what the others would say.
      fail-fast: false
      matrix:
        # Keep this list and the "/3" in this job in step: a shard that is
        # not listed here is a third of the tests that never runs.
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bouwmeester
          POSTGRES_PASSWORD: bouwmeester
          POSTGRES_DB: bouwmeester
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://bouwmeester:bouwmeester@localhost:5432/bouwmeester
      # CI has no OIDC. Settings fails closed without it, so opt into the
      # no-auth mode for the migration and test steps (same as local dev).
      DEV_NO_AUTH: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      # No report and no threshold here: a shard covers only what its own
      # third of the tests touches. `backend-test` holds the combined
      # coverage against `fail_under` from pyproject.toml.
      - name: Run tests with coverage
        run: >-
          uv run pytest --shard ${{ matrix.shard }}/3
          --cov --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: backend/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Branch protection may require a check with exactly this name. The job has
  # to run when a shard failed or was cancelled too: a job that is skipped
  # counts as passed for a required check.
  backend-test:
    needs: backend-test-shard
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: All shards passed
        if: needs.backend-test-shard.result != 'success'
        working-directory: ${{ github.workspace }}
        run: |
          echo "backend-test-shard: ${{ needs.backend-test-shard.result }}"
          exit 1

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage-shard-*
          path: backend
          merge-multiple: true

      - name: Combine coverage
        run: |
          uv run coverage combine
          uv run coverage xml
          uv run coverage report

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: TypeScript check
        run: npx tsc -b

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
