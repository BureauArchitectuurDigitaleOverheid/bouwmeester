[project]
name = "bouwmeester"
version = "0.1.0"
description = "Bouwmeester backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "anthropic>=0.94.0",
    "openai>=2.31.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.26",
    "authlib>=1.6.9",
    "cryptography>=46.0.7",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "pyrage>=1.3.0",
    "phonenumbers>=9.0.27",
    "webauthn>=2.7.1",
    "pdfminer-six>=20260107",
    "python-docx>=1.2.0",
    "odfpy>=1.4.1",
    "websockets>=13.1",
    "playwright>=1.59.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"

[tool.coverage.run]
source = ["bouwmeester"]
omit = ["bouwmeester/migrations/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
