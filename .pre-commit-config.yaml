repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      # Checks the nldd-* markup against the design system's own manifest and
      # icon registry. Catches the three things that fail silently in the
      # browser and that tsc cannot see: an unknown slot, an icon name outside
      # the closed set, and an element that does not exist in this version.
      - id: nldd-markup
        name: nldd markup
        entry: bash -c 'cd frontend && node scripts/validate-nldd-markup.mjs'
        language: system
        files: ^frontend/src/.*\.tsx$
        pass_filenames: false
