repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      # `tsc -b`, the same command CI runs. It used to be `--noEmit`, which
      # checks a different set of files: a stale required prop survived every
      # local commit and only turned CI red.
      - id: tsc
        name: tsc
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      # Checks the nldd-* markup against the design system's own manifest and
      # icon registry. Catches the three things that fail silently in the
      # browser and that tsc cannot see: an unknown slot, an icon name outside
      # the closed set, and an element that does not exist in this version.
      - id: nldd-markup
        name: nldd markup
        entry: bash -c 'cd frontend && node scripts/validate-nldd-markup.mjs'
        language: system
        files: ^frontend/src/.*\.tsx$
        pass_filenames: false

      # Every design-system CSS variable the app names must exist. An undefined
      # custom property renders nothing and says nothing; written with a
      # fallback it is worse, because the fallback ships and the token is
      # decoration. Fourteen invented names were in the tree when this was
      # added, six of them behind a hex fallback that made them look right in
      # light mode and freeze in dark.
      - id: nldd-tokens
        name: nldd tokens
        entry: bash -c 'cd frontend && node scripts/validate-nldd-tokens.mjs'
        language: system
        files: ^frontend/src/.*\.(tsx?|css)$
        pass_filenames: false

      # Every class the app renders must have a rule behind it, and every rule
      # in utilities.css must have a user. While Tailwind was installed its
      # compiler invented a rule for anything it recognised, so a class could
      # work without existing in any stylesheet we own; once the package left,
      # those kept compiling and stopped doing anything. This is the check for
      # that, and it was the only one of the three not wired in here — which is
      # how 112 dead classes survived, including a table that rendered as bare
      # HTML and three traffic lights that rendered as nothing at all.
      - id: nldd-css-classes
        name: nldd css classes
        entry: bash -c 'cd frontend && node scripts/validate-css-classes.mjs'
        language: system
        files: ^frontend/src/.*\.(tsx?|css)$
        pass_filenames: false
